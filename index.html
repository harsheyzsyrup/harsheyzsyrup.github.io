<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>harsheyz. | Restricted Area</title>
  <link rel="icon" href="/files/images/header.ico">
  <style>
    :root {
      --pk-yellow: #ffcc01;
      --pk-blue: #3c5aa6;
      --hazard-red: #cc0000;
      --police-yellow: #ffd700;
    }

    body {
      background-color: #050505;
      color: white;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      perspective: 1200px;
    }

    /* Background image */
    .bg-image {
      position: absolute;
      top: -10%; left: -10%;
      width: 120%; height: 120%;
      background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)),
                  url('/files/images/bg.png');
      background-size: cover;
      background-position: center;
      z-index: -1;
      transform: translateX(0px) translateY(0px) scale(1.1); /* default state */
      transition: transform 0.15s ease-out;
    }

    /* Police Tape */
    .police-tape {
      position: absolute;
      background: var(--police-yellow);
      color: black;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      text-transform: uppercase;
      font-size: 1.2rem;
      pointer-events: none;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      white-space: nowrap;
      height: 50px;
      z-index: 5;
    }

    #tape-main-1 { width: 150%; transform: rotate(-15deg); top: 30%; }
    #tape-main-2 { width: 150%; transform: rotate(10deg); bottom: 30%; background: #e6c200; }

    .corner-tape { width: 600px; }
    #tape-tl { top: 0; left: 0; transform: rotate(-45deg) translate(-150px, -50px); }
    #tape-tr { top: 0; right: 0; transform: rotate(45deg) translate(150px, -50px); }
    #tape-bl { bottom: 0; left: 0; transform: rotate(45deg) translate(-150px, 50px); }
    #tape-br { bottom: 0; right: 0; transform: rotate(-45deg) translate(150px, 50px); }

    /* Modal Box */
    .container {
      text-align: center;
      z-index: 100;
      background: rgba(0,0,0,0.95);
      padding: 40px 80px;
      border: 4px solid var(--pk-blue);
      border-radius: 10px;
      box-shadow: 0 0 60px rgba(60, 90, 166, 0.5);
      position: relative;
    }

    .sign {
      position: absolute;
      background: var(--hazard-red);
      color: white;
      padding: 8px 15px;
      border: 3px solid white;
      font-weight: 900;
      font-size: 0.8rem;
      border-radius: 4px;
    }
    #s1 { top: -20px; left: -30px; transform: rotate(-20deg); }
    #s2 { bottom: -10px; right: -40px; transform: rotate(15deg); }

    h1 {
      font-size: 4.5rem;
      color: var(--pk-yellow);
      text-shadow: 6px 6px 0px var(--pk-blue);
      margin: 0;
      letter-spacing: -2px;
    }

    .pokeball-container {
      margin: 25px auto;
      width: 80px;
      height: 80px;
    }

    .pokeball {
      width: 100%; height: 100%;
      background: white;
      border: 4px solid #000;
      border-radius: 50%;
      position: relative;
      animation: spin-360 2s linear infinite;
    }

    .pokeball::before {
      content: "";
      position: absolute;
      background: #ee1515;
      width: 100%; height: 50%;
      border-bottom: 4px solid #000;
      top: 0; left: 0;
      border-radius: 40px 40px 0 0;
    }

    .pokeball::after {
      content: "";
      position: absolute;
      top: calc(50% - 10px); left: calc(50% - 10px);
      width: 14px; height: 14px;
      background: white;
      border: 4px solid #000;
      border-radius: 50%;
      z-index: 10;
    }

    @keyframes spin-360 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .status-wrapper {
      position: relative;
      display: inline-block;
      color: var(--pk-yellow);
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 3px;
      margin-bottom: 25px;
    }

    .dots { position: absolute; left: 105%; }
    .dots::after {
      content: '';
      animation: dots-anim 1.5s steps(4, end) infinite;
    }

    @keyframes dots-anim {
      0% { content: ''; } 33% { content: '.'; } 66% { content: '..'; } 100% { content: '...'; }
    }

    .socials { display: flex; justify-content: center; gap: 25px; }
    .socials a { opacity: 0.5; transition: 0.3s ease; }
    .socials a:hover {
      opacity: 1; transform: scale(1.3);
      filter: drop-shadow(0 0 10px var(--pk-yellow));
    }
    .socials svg { width: 22px; height: 22px; fill: white; }
  </style>
</head>
<body>

  <div class="bg-image" id="moving-bg"></div>

  <div class="police-tape" id="tape-main-1">DO NOT ENTER • CAUTION • DO NOT ENTER • CAUTION</div>
  <div class="police-tape" id="tape-main-2">RESTRICTED AREA • CRIME SCENE • RESTRICTED AREA</div>

  <div class="police-tape corner-tape" id="tape-tl">DO NOT ENTER</div>
  <div class="police-tape corner-tape" id="tape-tr">DO NOT ENTER</div>
  <div class="police-tape corner-tape" id="tape-bl">DO NOT ENTER</div>
  <div class="police-tape corner-tape" id="tape-br">DO NOT ENTER</div>

  <div class="container">
    <div class="sign" id="s1">DANGER</div>
    <div class="sign" id="s2">KEEP OUT</div>

    <h1>harsheyz.</h1>

    <div class="pokeball-container">
      <div class="pokeball"></div>
    </div><br>

    <div class="status-wrapper">
      EVOLUTION IN PROGRESS<span class="dots"></span>
    </div>

    <div class="socials">
      <a href="https://instagram.com/totallynotharsh" target="_blank">…</a>
      <a href="https://linkedin.com/in/totallynotharsh" target="_blank">…</a>
      <a href="mailto:mehtharsh32@gmail.com">…</a>
    </div>
  </div>

  <script>
    const movingBg = document.getElementById('moving-bg');

    document.addEventListener('mousemove', (e) => {
      const sens = 30;
      const x = (window.innerWidth / 2 - e.pageX) / sens;
      const y = (window.innerHeight / 2 - e.pageY) / sens;

      movingBg.style.transform = `translateX(${x}px) translateY(${y}px) scale(1.1)`;
    });
  </script>
</body>
</html>
